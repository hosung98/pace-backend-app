spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pace_dev}
    username: ${DB_USERNAME:pace_dev_user}
    password: ${DB_PASSWORD:}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
pace:
  jwt-secret: ${JWT_SECRET:}
  google-client-ids: ${GOOGLE_CLIENT_IDS:local-unconfigured}
