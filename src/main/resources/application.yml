spring:
  application:
    name: pace-backend-app
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    persist-authorization: false
pace:
  jwt-secret: ${JWT_SECRET}
  google-client-ids: ${GOOGLE_CLIENT_IDS}
  apple-client-ids: ${APPLE_CLIENT_IDS:com.hocompany.pace}
  apple-client-id: ${APPLE_CLIENT_ID:com.hocompany.pace}
  apple-client-secret: ${APPLE_CLIENT_SECRET:}
  cors-origins: ${CORS_ORIGINS:}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
