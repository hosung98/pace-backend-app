spring:
  application:
    name: pace-backend-app
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    persist-authorization: false
pace:
  jwt-secret: ${JWT_SECRET}
  google-client-ids: ${GOOGLE_CLIENT_IDS}
  apple-client-ids: ${APPLE_CLIENT_IDS:com.hocompany.pace}
  apple-client-id: ${APPLE_CLIENT_ID:com.hocompany.pace}
  apple-client-secret: ${APPLE_CLIENT_SECRET:}
  cors-origins: ${CORS_ORIGINS:}
  scheduler:
    race-deadline:
      lock-at-most-for: ${PACE_RACE_DEADLINE_LOCK_AT_MOST_FOR:PT1M}
      lock-at-least-for: ${PACE_RACE_DEADLINE_LOCK_AT_LEAST_FOR:PT0S}
    account-cleanup:
      lock-at-most-for: ${PACE_ACCOUNT_CLEANUP_LOCK_AT_MOST_FOR:PT2M}
      lock-at-least-for: ${PACE_ACCOUNT_CLEANUP_LOCK_AT_LEAST_FOR:PT0S}
  rate-limit:
    enabled: ${PACE_RATE_LIMIT_ENABLED:true}
    max-requests: ${PACE_RATE_LIMIT_MAX_REQUESTS:5000}
    window-seconds: ${PACE_RATE_LIMIT_WINDOW_SECONDS:60}
  request-body-cache:
    enabled: ${PACE_REQUEST_BODY_CACHE_ENABLED:true}
    max-payload-bytes: ${PACE_REQUEST_BODY_CACHE_MAX_PAYLOAD_BYTES:1048576}
    max-log-chars: ${PACE_REQUEST_BODY_CACHE_MAX_LOG_CHARS:2048}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
